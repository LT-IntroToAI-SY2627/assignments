name: GH-4 Autograder

on:
  push:
    branches:
      - 'gh4-*'

jobs:
  autograde:
    runs-on: ubuntu-latest
    name: Run GH-4 Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Problem 4 - remove_duplicates
        continue-on-error: true
        working-directory: gh4
        run: |
          python -c "
          from gh4 import remove_duplicates
          assert remove_duplicates([1, 2, 2, 3, 3, 3]) == [1, 2, 3], 'remove_duplicates([1,2,2,3,3,3]) should return [1,2,3]'
          assert remove_duplicates([1, 1, 1]) == [1], 'remove_duplicates([1,1,1]) should return [1]'
          assert remove_duplicates([]) == [], 'remove_duplicates([]) should return []'
          print('Problem 4 - remove_duplicates: PASSED')
          "

      - name: Test Problem 5 - every_other
        continue-on-error: true
        working-directory: gh4
        run: |
          python -c "
          from gh4 import every_other
          assert every_other([1, 2, 3, 4, 5]) == [1, 3, 5], 'every_other([1,2,3,4,5]) should return [1,3,5]'
          assert every_other([10, 20, 30]) == [10, 30], 'every_other([10,20,30]) should return [10,30]'
          assert every_other([]) == [], 'every_other([]) should return []'
          print('Problem 5 - every_other: PASSED')
          "

      - name: Test Problem 6 - is_sorted
        continue-on-error: true
        working-directory: gh4
        run: |
          python -c "
          from gh4 import is_sorted
          assert is_sorted([1, 2, 3, 4, 5]) == True, 'is_sorted([1,2,3,4,5]) should return True'
          assert is_sorted([1, 3, 2, 4, 5]) == False, 'is_sorted([1,3,2,4,5]) should return False'
          assert is_sorted([]) == True, 'is_sorted([]) should return True'
          print('Problem 6 - is_sorted: PASSED')
          "
